name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12 3.14
      - run: uv run pytest -q
      - run: uv venv --python 3.14 analysis/ha-venv
      - run: uv pip install --python analysis/ha-venv/bin/python homeassistant==2026.10.4 pytest-homeassistant-custom-component==0.13.375
      - run: analysis/ha-venv/bin/python -m pytest -c tests_hass/pytest.ini tests_hass -q
      - run: uv run python tools/package_hacs.py
